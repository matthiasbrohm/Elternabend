# Baut die ZIP-Dateien und veröffentlicht sie als GitHub-Release.
#
# Auslöser:
# - Änderung der Versionsnummer in Elternabend.toc auf dem Branch main
#   (gibt es für diese Nummer noch kein Release, wird es automatisch angelegt)
# - ein neuer Tag oder ein über die Webseite veröffentlichtes Release
# - von Hand unter "Actions → Release bauen → Run workflow"
name: Release bauen

on:
  push:
    branches: [main]
    paths: ['Elternabend.toc', '.github/workflows/release.yml']
    tags: ['*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' Elternabend.toc | tr -d '\r' | head -n1)"
            TAG="$VERSION"
          fi
          if [ -z "$VERSION" ]; then echo "Keine Versionsnummer gefunden" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Bei einer Änderung auf main ohne neue Versionsnummer nichts tun
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ] \
             && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ZIP-Dateien bauen
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/Elternabend
          rsync -a ./ build/Elternabend/ \
            --exclude '.git' --exclude '.github' --exclude 'build' \
            --exclude '.gitignore' --exclude '.gitattributes' --exclude '.gitkeep' --exclude '.pkgmeta' \
            --exclude 'Taktik-Werkstatt' --exclude 'Mac-App'
          sed -i "s/^## Version:.*/## Version: $VERSION/" build/Elternabend/Elternabend.toc
          cd build
          zip -rq "Elternabend-$VERSION.zip" Elternabend
          cp "Elternabend-$VERSION.zip" "Elternabend-$VERSION-forever.zip"
          ls -l

      - name: Release anlegen oder ZIPs anhängen
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.zip --clobber
          else
            gh release create "$TAG" build/*.zip --target "$GITHUB_SHA" \
              --title "Elternabend $VERSION" --generate-notes
          fi

  # Dieselbe Version zusätzlich zu CurseForge hochladen (BigWigs-Packager).
  # Läuft nur, wenn bei GitHub das Secret CF_API_KEY hinterlegt ist und in der .toc
  # die Zeile „## X-Curse-Project-ID: …“ steht.
  curseforge:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - name: Prüfen, ob CurseForge eingerichtet ist
        id: check
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "Kein CF_API_KEY hinterlegt – CurseForge wird übersprungen."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.go == 'true'
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      # Den Packager direkt aufrufen statt als fertige Action: Bei einem Push auf main
      # bricht er sonst ab („Found future tag“), weil er auf einen eigenen Tag-Lauf wartet.
      # Unser Tag entsteht aber erst in diesem Workflow und löst keinen neuen Lauf aus.
      - name: Zu CurseForge hochladen
        if: steps.check.outputs.go == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_EVENT_NAME=workflow_dispatch bash "$RUNNER_TEMP/release.sh"
