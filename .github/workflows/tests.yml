# Testet das Addon ohne WoW (Ordner tests) bei jedem Push und jedem Pull Request.
# Dauert wenige Sekunden. Vor jedem Release laufen dieselben Tests noch einmal (release.yml).
name: Tests

on:
  push:
    paths: ['**.lua', '*.toc', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LuaJIT installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit >/dev/null

      - name: Tests
        run: luajit tests/run.lua
